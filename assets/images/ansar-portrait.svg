<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Ansar Mahmood portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2F6E"/>
      <stop offset="0.55" stop-color="#15265E"/>
      <stop offset="1" stop-color="#0C1E3E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43A95C"/>
      <stop offset="1" stop-color="#1E8A3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#2A47A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#15265E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- silhouette -->
  <g transform="translate(400 470)" fill="#9FB2D8" opacity="0.9">
    <circle cx="0" cy="-70" r="135"/>
    <path d="M-230 320 C-230 120 -130 70 0 70 C130 70 230 120 230 320 Z"/>
  </g>
  <circle cx="400" cy="400" r="250" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.55"/>
  <!-- monogram -->
  <text x="400" y="840" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="120" font-weight="800" fill="#FFFFFF">AM</text>
  <text x="400" y="900" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#43A95C">PORTRAIT · PLACEHOLDER</text>
</svg>
